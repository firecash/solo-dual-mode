name: Build verified Windows bridge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Fix CRLF
        run: git config --global core.autocrlf false
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge-src
      - name: Build Windows bridge
        shell: bash
        run: cargo build --locked --release --manifest-path bridge-src/Cargo.toml --bin stratum-bridge
      - name: Verify merged-mining capability and static runtime
        shell: pwsh
        run: |
          $exe = "bridge-src/target/release/stratum-bridge.exe"
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          foreach ($marker in @("ZKAS_KASPA_NODE", "merged_kaspa_address", "Real merged mining ENABLED")) {
            if (-not $text.Contains($marker)) { throw "Missing merged-mining marker: $marker" }
          }
          foreach ($dll in @("libstdc++-6.dll", "libgcc_s_seh-1.dll", "libwinpthread-1.dll", "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            if ($text.ToLowerInvariant().Contains($dll)) { throw "Forbidden runtime dependency: $dll" }
          }
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bridge-src/target/release/stratum-bridge.exe, bridge.yaml.template, README.md, install.ps1, run.ps1 dist/
          Compress-Archive -Path dist/* -DestinationPath solo-dual-mode-windows-x64.zip
      - name: Upload Windows release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          files: solo-dual-mode-windows-x64.zip
