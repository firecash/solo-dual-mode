name: Build verified Windows bridge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Fix CRLF
        run: git config --global core.autocrlf false
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Checkout proven Rusty workspace
        uses: actions/checkout@v4
        with:
          repository: firecash/zkas-rusty
          ref: e3589f7e3bedf21b4894ceb562a61468108529a5
          path: rusty
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rusty
      - name: Overlay solo bridge onto Rusty workspace
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force bridge-src/bridge/* rusty/bridge/
          New-Item -ItemType Directory -Force rusty/crates/katpool-domain | Out-Null
          Copy-Item -Recurse -Force bridge-src/crates/katpool-domain/* rusty/crates/katpool-domain/
          # Adapt the two workspace-inherited fields absent from the pinned
          # Rusty root manifest. Source code and dependency versions stay unchanged.
          $bridgeManifest = Get-Content rusty/bridge/Cargo.toml -Raw
          $bridgeManifest.Replace('prometheus = { workspace = true }', 'prometheus = "0.14.0"') | Set-Content rusty/bridge/Cargo.toml
          $domainManifest = Get-Content rusty/crates/katpool-domain/Cargo.toml -Raw
          $domainManifest = $domainManifest.Replace('publish.workspace = true', 'publish = false')
          $domainManifest.Replace('proptest = { workspace = true }', 'proptest = "1"') | Set-Content rusty/crates/katpool-domain/Cargo.toml
      - name: Validate overlaid Rusty workspace
        shell: bash
        run: cargo metadata --manifest-path rusty/Cargo.toml --no-deps --format-version 1 > /dev/null
      - name: Build Windows bridge
        shell: bash
        run: |
          # Preserve the exact successful v1.0.5 native-Windows build order.
          cargo build --release --manifest-path rusty/Cargo.toml --bin kaspad
          cargo build --release --manifest-path rusty/Cargo.toml --bin stratum-bridge
      - name: Verify merged-mining capability and static runtime
        shell: pwsh
        run: |
          $exe = "rusty/target/release/stratum-bridge.exe"
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          foreach ($marker in @("ZKAS_KASPA_NODE", "merged_kaspa_address", "Real merged mining ENABLED")) {
            if (-not $text.Contains($marker)) { throw "Missing merged-mining marker: $marker" }
          }
          foreach ($dll in @("libstdc++-6.dll", "libgcc_s_seh-1.dll", "libwinpthread-1.dll", "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            if ($text.ToLowerInvariant().Contains($dll)) { throw "Forbidden runtime dependency: $dll" }
          }
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item rusty/target/release/stratum-bridge.exe, bridge.yaml.template, README.md, install.ps1, run.ps1 dist/
          Compress-Archive -Path dist/* -DestinationPath solo-dual-mode-windows-x64.zip
      - name: Upload Windows release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          files: solo-dual-mode-windows-x64.zip
