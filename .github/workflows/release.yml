name: Release solo dual-mode bridge

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
            binary: stratum-bridge
          - os: windows-latest
            artifact: windows-x64
            binary: stratum-bridge.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - name: Install Protocol Buffers compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge-src
      - name: Build bridge on Linux (portable MUSL)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source musl-toolchain/build.sh
          cd "$GITHUB_WORKSPACE"
          export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,--allow-multiple-definition"
          cargo build --locked --release --manifest-path bridge-src/Cargo.toml --bin stratum-bridge --target x86_64-unknown-linux-musl
          mkdir -p bridge-src/target/release
          cp bridge-src/target/x86_64-unknown-linux-musl/release/stratum-bridge bridge-src/target/release/
      - name: Build bridge on Windows (static MSVC CRT)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --locked --release --manifest-path bridge-src/Cargo.toml --bin stratum-bridge
      - name: Verify merged-mining capability
        shell: bash
        run: |
          grep -a -q 'ZKAS_KASPA_NODE' bridge-src/target/release/${{ matrix.binary }}
          grep -a -q 'Real merged mining ENABLED' bridge-src/target/release/${{ matrix.binary }}
      - name: Stage files
        shell: bash
        run: |
          mkdir dist
          cp bridge-src/target/release/${{ matrix.binary }} dist/
          cp bridge.yaml.template README.md install.sh install.ps1 run.ps1 dist/
      - name: Package Linux ZIP
        if: runner.os == 'Linux'
        shell: bash
        run: cd dist && zip -r ../solo-dual-mode-${{ matrix.artifact }}.zip .
      - name: Package Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath solo-dual-mode-${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: solo-dual-mode-${{ matrix.artifact }}
          path: solo-dual-mode-${{ matrix.artifact }}.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package and checksum
        run: |
          find artifacts -name '*.zip' -exec cp {} . \;
          sha256sum *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            SHA256SUMS
