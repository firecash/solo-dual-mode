[workspace]
resolver = "2"
members = ["bridge", "crates/katpool-domain"]
exclude = ["bridge/fuzz"]

[workspace.package]
version = "1.0.10"
edition = "2024"
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
authors = ["ZKas contributors"]
repository = "https://github.com/firecash/solo-dual-mode"
publish = false

[workspace.dependencies]
kaspa-alloc          = { git = "https://github.com/firecash/zkas-rusty", rev = "5e192e59819319288c883be28f2ef9d1cf29ebf6" }
kaspa-consensus-core = { git = "https://github.com/firecash/zkas-rusty", rev = "5e192e59819319288c883be28f2ef9d1cf29ebf6" }
kaspa-hashes         = { git = "https://github.com/firecash/zkas-rusty", rev = "5e192e59819319288c883be28f2ef9d1cf29ebf6" }
kaspa-math           = { git = "https://github.com/firecash/zkas-rusty", rev = "5e192e59819319288c883be28f2ef9d1cf29ebf6" }
kaspa-merkle         = { git = "https://github.com/firecash/zkas-rusty", rev = "5e192e59819319288c883be28f2ef9d1cf29ebf6" }
kaspa-pow            = { git = "https://github.com/firecash/zkas-rusty", rev = "5e192e59819319288c883be28f2ef9d1cf29ebf6" }
kaspa-addresses      = { git = "https://github.com/firecash/zkas-rusty", rev = "5e192e59819319288c883be28f2ef9d1cf29ebf6" }
kaspa-rpc-core       = { git = "https://github.com/firecash/zkas-rusty", rev = "5e192e59819319288c883be28f2ef9d1cf29ebf6" }
kaspa-rpc-service    = { git = "https://github.com/firecash/zkas-rusty", rev = "5e192e59819319288c883be28f2ef9d1cf29ebf6" }
kaspa-grpc-client    = { git = "https://github.com/firecash/zkas-rusty", rev = "5e192e59819319288c883be28f2ef9d1cf29ebf6" }
kaspa-notify         = { git = "https://github.com/firecash/zkas-rusty", rev = "5e192e59819319288c883be28f2ef9d1cf29ebf6" }
kaspa-core           = { git = "https://github.com/firecash/zkas-rusty", rev = "5e192e59819319288c883be28f2ef9d1cf29ebf6" }
kaspa-utils          = { git = "https://github.com/firecash/zkas-rusty", rev = "5e192e59819319288c883be28f2ef9d1cf29ebf6" }
kaspad               = { git = "https://github.com/firecash/zkas-rusty", rev = "5e192e59819319288c883be28f2ef9d1cf29ebf6" }
dirs = "5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
num-traits = "0.2"
async-trait = "0.1"
once_cell = "1"
futures-util = "0.3"
parking_lot = "0.12"
regex = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
clap = { version = "4", features = ["derive"] }
prometheus = "0.14"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
proptest = "1"

[workspace.lints.rust]
warnings = "allow"

[workspace.lints.clippy]
all = "allow"

[workspace.lints.rustdoc]
all = "allow"

[profile.release]
lto = "thin"
strip = true
overflow-checks = true

[profile.release.package.halo2_proofs]
opt-level = 3
codegen-units = 1
overflow-checks = false

[profile.release.package.halo2_gadgets]
opt-level = 3
codegen-units = 1
overflow-checks = false

[profile.release.package.pasta_curves]
opt-level = 3
codegen-units = 1
overflow-checks = false

[profile.release.package.orchard]
opt-level = 3
codegen-units = 1
overflow-checks = false

[profile.release.package.ff]
opt-level = 3
overflow-checks = false

[profile.release.package.group]
opt-level = 3
overflow-checks = false
